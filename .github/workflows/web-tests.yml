name: Web app tests

on:
  push:
    paths:
      - "web/**"
      - "cmd/**"
      - "internal/**"
      - "tests/**"
      - ".github/workflows/web-tests.yml"
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: examtopics_test
          MYSQL_USER: examtopics
          MYSQL_PASSWORD: examtopics-test-pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, mbstring, dom, xml, gd, pcntl, posix, curl
          coverage: none

      - name: Install PHP dependencies
        working-directory: web
        run: composer install --no-interaction --no-progress

      - name: Run unit, integration and end-to-end tests
        working-directory: web
        env:
          EXAMTOPICS_TEST_DSN: "mysql:host=127.0.0.1;port=3306;dbname=examtopics_test;charset=utf8mb4"
          EXAMTOPICS_TEST_USER: examtopics
          EXAMTOPICS_TEST_PASSWORD: examtopics-test-pw
        run: vendor/bin/phpunit
